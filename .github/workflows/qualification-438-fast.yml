name: Qualification 438 FAST

on:
  push:
    branches:
      - qualification-438-fast

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f8ee42c5afcf660284d329ed8b5cc14477ea99f
          fetch-depth: 1

      - name: Verify exact dev SHA
        run: test "$(git rev-parse HEAD)" = "2f8ee42c5afcf660284d329ed8b5cc14477ea99f"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run exact-head FAST qualification
        run: |
          mkdir -p artifacts/qualification-438-fast
          PYTHONPATH=src python -m alphaforge.autonomous_qualification             --mode fast             --output-root artifacts/qualification-438-fast             --json | tee artifacts/qualification-438-fast/stdout.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-438-fast-exact-head
          path: artifacts/qualification-438-fast
          if-no-files-found: error
