name: Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  dispatch-dedupe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Reuse successful exact-SHA qualification
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          match="$(
            gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs" \
              -f branch="${GITHUB_REF_NAME}" \
              -f status=success \
              -F per_page=50 \
              --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and (.event == \"push\" or .event == \"workflow_dispatch\")) | .id" \
              | head -n 1
          )"
          if [ -n "$match" ]; then
            echo "Found successful full qualification for ${GITHUB_SHA}: run ${match}"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful full qualification found for ${GITHUB_SHA}"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: dispatch-dedupe
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.dispatch-dedupe.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q src

      - name: System verification routing gate
        if: github.event_name == 'pull_request'
        run: |
          pytest -q tests/test_issue437_system_verification_router.py
          PYTHONPATH=src python -m alphaforge.system_verification plan \
            --base "origin/${GITHUB_BASE_REF}" \
            --head HEAD \
            --output artifacts/system-verification-plan.json
          cat artifacts/system-verification-plan.json

      - name: Cross-surface invariant gate
        if: github.event_name == 'pull_request'
        run: pytest -q tests/test_cross_surface_invariants.py tests/test_issue421_decision_invariant.py tests/test_ci_branch_contract.py

      - name: System audit fabric gate
        if: github.event_name == 'pull_request'
        run: pytest -q tests/test_system_audit_fabric_l0.py tests/test_system_audit_fabric_l1.py tests/test_system_audit_fabric_l2.py tests/test_system_audit_fabric_contract.py

      - name: Routed PR verification
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          plan = json.loads(
              Path("artifacts/system-verification-plan.json").read_text()
          )
          always_covered = {
              "tests/test_ci_branch_contract.py",
              "tests/test_issue421_decision_invariant.py",
              "tests/test_issue498_cross_component_mutations.py",
          }
          selected = [
              path
              for path in plan.get("selected_tests", [])
              if path not in always_covered
          ]
          print(
              "verification route:",
              plan["risk_level"],
              ",".join(plan["required_tiers"]),
          )
          print(
              "routed tests:",
              " ".join(selected) if selected else "<always-on guards only>",
          )
          if selected:
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", *selected],
                  check=True,
              )
          PY

      - name: Full regression suite
        if: github.event_name != 'pull_request'
        run: pytest -q

      - name: Protected safety mutation gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pytest -q tests/test_issue498_cross_component_mutations.py
          fi
          python scripts/run_safety_mutations.py

      - name: Run offline backtest
        run: |
          PYTHONPATH=src python backtest_order.py --ci --offline --output-dir artifacts/backtest

      - name: Verify backtest outputs
        run: test -s artifacts/backtest/order_lifecycle.csv

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-artifacts
          path: |
            artifacts/backtest/order_lifecycle.csv
            artifacts/backtest/rejected_orders.csv
            artifacts/backtest/backtest_orders.csv
            artifacts/backtest/order_backtest_summary.csv
          if-no-files-found: warn
          retention-days: 14
