# Trusted main branch only. PR code must never be checked out.
# Becomes active after this workflow is merged onto default branch main.
name: Codex Delivery Verification

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open Codex PR number; choose this OR tests_run_id"
        required: false
        type: string
      tests_run_id:
        description: "Existing completed Tests push/dev run; read-only audit, no Tests rerun"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: codex-delivery-verifier-v1
  cancel-in-progress: false

jobs:
  verify:
    # Ignore ordinary discussion and the verifier's own comments.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, 'TASK: #') &&
       contains(github.event.comment.body, 'RESULT:')) ||
      (github.event_name == 'workflow_run' &&
       ((github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'dev') ||
        startsWith(github.event.workflow_run.head_branch, 'codex/') ||
        github.event.workflow_run.pull_requests[0] != null))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main verifier only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Verify latest task delivery without PR checkout
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_RECEIPTS_PATH: ${{ runner.temp }}/codex-delivery-receipts.json
        run: python3 scripts/verify_codex_delivery.py
      - name: Preserve verification receipts independently of comment delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-delivery-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-delivery-receipts.json
          if-no-files-found: warn
