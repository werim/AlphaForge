name: Isolated JOB-04 feature patch runner

on:
  pull_request:
    types: [opened, synchronize]
    branches: [job04-runner-base]

permissions:
  contents: write

jobs:
  patch_feature_branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: job04-effective-rr-clean-dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply evidence-preserving effective-RR corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          execution = Path('src/alphaforge/execution.py')
          text = execution.read_text()
          old = '''    md_latency = _to_float(market_ctx.get("market_data_latency_ms"))
    md_latency_status = str(market_ctx.get("market_data_latency_status", "MEASURED" if md_latency is not None else "UNAVAILABLE"))
    md_latency_source = str(market_ctx.get("market_data_latency_source", "UNKNOWN" if md_latency is not None else "UNAVAILABLE"))
'''
          new = '''    raw_market_data_latency = market_ctx.get("market_data_latency_ms")
    raw_legacy_latency = market_ctx.get("latency_ms")
    md_latency = _to_float(raw_market_data_latency if raw_market_data_latency is not None else raw_legacy_latency)
    default_latency_source = "LEGACY_LATENCY_MS" if raw_market_data_latency is None and md_latency is not None else ("UNKNOWN" if md_latency is not None else "UNAVAILABLE")
    md_latency_status = str(market_ctx.get("market_data_latency_status", "MEASURED" if md_latency is not None else "UNAVAILABLE"))
    md_latency_source = str(market_ctx.get("market_data_latency_source", default_latency_source))
'''
          assert old in text, 'latency evidence source block not found'
          execution.write_text(text.replace(old, new))

          runtime = Path('src/alphaforge/runtime.py')
          text = runtime.read_text()
          duplicate = '''        canonical_effective_rr = max(raw_rr - float(cost_model.total_penalty), 0.0)
        signal_id = self._resolve_signal_id(selection.symbol, market_ctx)
        execution_ctx = build_execution_context(market_ctx)
        market_ctx["execution_ctx"] = execution_ctx
'''
          assert duplicate in text, 'duplicate execution context block not found'
          text = text.replace(duplicate, '''        canonical_effective_rr = max(raw_rr - float(cost_model.total_penalty), 0.0)
        signal_id = self._resolve_signal_id(selection.symbol, market_ctx)
''')
          old_risk = '''            await self._persist_reject({"signal_id": signal_id, "symbol": selection.symbol, "mode": self.config.execution_mode.value, "phase": "final", "decision": "REJECTED", "reason": risk_reject, "confidence": 0.0, "score": 0.0, "rr": raw_rr, "effective_rr": canonical_effective_rr, "explanation": "runtime_risk_gate", "execution_ctx": {**execution_ctx, "phase": "runtime_risk_gate", "market_ts": market_ctx.get("market_ts"), "risk_reject": risk_reject}})
'''
          new_risk = '''            await self._persist_reject({"signal_id": signal_id, "symbol": selection.symbol, "mode": self.config.execution_mode.value, "phase": "final", "decision": "REJECTED", "reason": risk_reject, "confidence": 0.0, "score": 0.0, "rr": raw_rr, "effective_rr": canonical_effective_rr, "explanation": "runtime_risk_gate", "execution_ctx": {**execution_ctx, "phase": "runtime_risk_gate", "market_ts": market_ctx.get("market_ts"), "risk_reject": risk_reject}, "spread_pct": execution_ctx.get("spread_pct"), "expected_slippage_pct": execution_ctx.get("expected_slippage_pct"), "latency_ms": execution_ctx.get("market_data_latency_ms"), "funding_rate_pct": execution_ctx.get("funding_rate_pct"), "orderbook_imbalance": execution_ctx.get("orderbook_imbalance"), "volatility_regime": execution_ctx.get("volatility_regime")})
'''
          assert old_risk in text, 'runtime reject persistence payload not found'
          text = text.replace(old_risk, new_risk)
          old_ai = '''                "explanation": explanation,
                "execution_ctx": {**execution_ctx, "phase": "before_real_order", "market_ts": market_ctx.get("market_ts"), "reject_reason_raw": order_plan.reason},
'''
          new_ai = '''                "explanation": explanation,
                "execution_ctx": {**execution_ctx, "phase": "before_real_order", "market_ts": market_ctx.get("market_ts"), "reject_reason_raw": order_plan.reason},
                "spread_pct": execution_ctx.get("spread_pct"),
                "expected_slippage_pct": execution_ctx.get("expected_slippage_pct"),
                "latency_ms": execution_ctx.get("market_data_latency_ms"),
                "funding_rate_pct": execution_ctx.get("funding_rate_pct"),
                "orderbook_imbalance": execution_ctx.get("orderbook_imbalance"),
                "volatility_regime": execution_ctx.get("volatility_regime"),
'''
          assert old_ai in text, 'AI reject persistence payload not found'
          text = text.replace(old_ai, new_ai)
          old_wrapper = '''                effective_rr=payload.get("effective_rr"),
                explanation=payload.get("explanation"),
                execution_ctx=payload.get("execution_ctx", {}),
'''
          new_wrapper = '''                effective_rr=payload.get("effective_rr"),
                explanation=payload.get("explanation"),
                execution_ctx=payload.get("execution_ctx", {}),
                spread_pct=payload.get("spread_pct"),
                expected_slippage_pct=payload.get("expected_slippage_pct"),
                latency_ms=payload.get("latency_ms"),
                funding_rate_pct=payload.get("funding_rate_pct"),
                orderbook_imbalance=payload.get("orderbook_imbalance"),
                volatility_regime=payload.get("volatility_regime"),
'''
          assert old_wrapper in text, 'save_order_decision wrapper block not found'
          runtime.write_text(text.replace(old_wrapper, new_wrapper))
          PY
          python -m compileall -q src/alphaforge
          pytest -q tests/test_runtime.py tests/test_phase123_foundations.py tests/test_job21_audit_integrity.py tests/test_job22_rollback_evidence.py tests/test_live_readiness.py
          git add src/alphaforge/execution.py src/alphaforge/runtime.py
          git commit -m "Preserve execution evidence while canonicalizing effective RR"
          git push origin HEAD:job04-effective-rr-clean-dev
