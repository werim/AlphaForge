name: Current Dev FAST Qualification

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a21159491e23184e1db611952ca161acf795b59
          fetch-depth: 1

      - name: Verify exact dev SHA
        run: test "$(git rev-parse HEAD)" = "4a21159491e23184e1db611952ca161acf795b59"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run exact-head FAST qualification
        run: |
          mkdir -p artifacts/current-dev-fast
          PYTHONPATH=src python -m alphaforge.autonomous_qualification \
            --mode fast \
            --output-root artifacts/current-dev-fast \
            --json | tee artifacts/current-dev-fast/stdout.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-dev-fast-4a21159491e2
          path: artifacts/current-dev-fast
          if-no-files-found: error
