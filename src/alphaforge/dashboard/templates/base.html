<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AlphaForge Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="/static/dashboard.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="sigil">α</span> AlphaForge <small>Operations Console</small></div>
    <nav>
      <a href="/" class="{% if page == 'overview' %}active{% endif %}">Overview</a>
      <a href="/rejects" class="{% if page == 'rejects' %}active{% endif %}">Rejects</a>
      <a href="/lifecycle" class="{% if page == 'lifecycle' %}active{% endif %}">Lifecycle</a>
      <a href="/readiness" class="{% if page == 'readiness' %}active{% endif %}">Readiness</a>
      <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Settings</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Read-only console · no order submission · no LIVE activation controls</footer>
</body>
</html>
